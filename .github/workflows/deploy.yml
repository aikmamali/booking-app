name: Deploy

# Production deploys only from main, and only after CI is green (spec section 12).
# Needs the repository secrets DEPLOY_HOST, DEPLOY_USER, DEPLOY_PATH and DEPLOY_SSH_KEY;
# without them the job is skipped.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
    steps:
      - name: Skip when the server is not configured yet
        id: configured
        run: echo "ready=${{ secrets.DEPLOY_HOST != '' && secrets.DEPLOY_SSH_KEY != '' }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.configured.outputs.ready == 'true'

      - uses: shivammathur/setup-php@v2
        if: steps.configured.outputs.ready == 'true'
        with:
          php-version: '8.3'
          tools: composer:v2

      - name: Install Deployer
        if: steps.configured.outputs.ready == 'true'
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Set up SSH
        if: steps.configured.outputs.ready == 'true'
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Trust the server
        if: steps.configured.outputs.ready == 'true'
        run: ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Deploy
        if: steps.configured.outputs.ready == 'true'
        run: vendor/bin/dep deploy production -vv
